  roles:
    - Security Administrator
    - Organization Management
  note: 'New-/Get-TenantAllowBlockListItems require the Security Administrator (or
    Organization Management) role group, not Exchange Administrator -- confirmed
    against Microsoft''s Tenant Allow/Block List configuration guide. The first
    tool in this connector that is not an Exchange Administrator action.'
exo_list_gdap_roles:
  roles: null
  note: 'Meta tool: serves this file''s own contents (PRD-21193); not itself a client-tenant
    action, so it carries no role of its own -- included here so the registered-tools/yaml/README
    three-way consistency check (AC7) has no silent exception.'
