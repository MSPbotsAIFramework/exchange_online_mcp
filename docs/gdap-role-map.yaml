# exchange_online_mcp GDAP role map.
# One entry per tool this server registers (enforced by tests/test_gdap_role_map.py).
# All 18 real Exchange tools map to Exchange Administrator (the ticket's own worked
# example); see each entry's note for why.
# PRD-21193.
exo_get_mailbox:
  roles: &id001
  - Exchange Administrator
  note: Matches the ticket's own worked example (exo_add_mailbox_permission -> Exchange
    Administrator) and Microsoft's GDAP guidance (Exchange administrator manages mailboxes,
    transport rules, and can grant SendOnBehalf).
